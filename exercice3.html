<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>TP01 - Exercice 3 - Interaction</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
  <script>
    AFRAME.registerComponent('clickable-box', {
      init: function () {
        var el = this.el;
        var colors = ['#4CC3D9', '#EF2D5E', '#FFC65D', '#7BC8A4', '#FFFFFF'];
        el.addEventListener('click', function () {
          var newColor = colors[Math.floor(Math.random() * colors.length)];
          el.setAttribute('color', newColor);
          el.removeAttribute('animation__spin');
          el.setAttribute('animation__spin', {
            property: 'rotation',
            to: '0 ' + (el.getAttribute('rotation').y + 720) + ' 0',
            loop: false,
            dur: 1000,
            easing: 'easeOutQuad'
          });
          el.removeAttribute('animation__scale');
          el.setAttribute('animation__scale', {
            property: 'scale',
            to: '1.5 1.5 1.5',
            dir: 'alternate',
            dur: 300,
            loop: 2
          });
        });
      }
    });
  </script>
</head>
<body style="margin: 0; overflow: hidden;">
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false"
            cursor="rayOrigin: mouse">

    <a-marker preset="hiro">
      <a-box position="0 0.5 0" color="#4CC3D9" opacity="0.6" transparent="true"
             clickable-box
             animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear">
      </a-box>
    </a-marker>

    <a-entity camera>
      <a-cursor
        raycaster="objects: .clickable, a-box"
        fuse="false"
        material="color: white; shader: flat">
      </a-cursor>
    </a-entity>

  </a-scene>
</body>
</html>
