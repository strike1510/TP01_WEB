<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>TP01 - Exercice 5 - QR + Hiro</title>
</head>
<body style="font-family: sans-serif; text-align: center; padding: 40px;">
  <h1>Exercice 5 : QR code + marker Hiro</h1>
  <p>Scannez ce QR code pour ouvrir le site, puis pointez la camera vers le meme QR code.</p>

  <div style="position: relative; display: inline-block;">
    <img id="qrcode" src="" alt="QR code" style="width: 340px; height: 340px;">
    <img src="marker/HIRO.jpg" alt="Hiro"
         style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 60px; height: 60px; background: white; border: 3px solid white;">
  </div>

  <script>
    const url = "https://strike1510.github.io/TP01_WEB/exercice3.html";
    document.getElementById('qrcode').src =
      "https://api.qrserver.com/v1/create-qr-code/?size=340x340&ecc=H&data=" + encodeURIComponent(url);
  </script>
</body>
</html>
