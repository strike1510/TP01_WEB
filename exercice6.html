<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>TP01 - Exercice 6 - UI DOM overlay</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
  <style>
    #ui-overlay {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      padding: 15px 20px;
      border-radius: 12px;
      z-index: 999;
      color: white;
      font-family: sans-serif;
      text-align: center;
      width: 260px;
    }
    #ui-overlay label { display: block; margin-bottom: 6px; font-size: 14px; }
    #size-slider { width: 100%; }
    .color-swatch {
      display: inline-block;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      margin: 0 8px;
      cursor: pointer;
      border: 2px solid white;
    }
  </style>
</head>
<body style="margin: 0; overflow: hidden;">

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">
    <a-marker id="hiro-marker" preset="hiro">
      <a-box id="ar-box" position="0 0.5 0" color="#4CC3D9" width="1" height="1" depth="1"></a-box>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>

  <div id="ui-overlay">
    <label for="size-slider">Taille de la boîte : <span id="size-value">1.0</span></label>
    <input type="range" id="size-slider" min="0.1" max="3.0" step="0.1" value="1.0">
    <div style="margin-top: 12px;">
      <span class="color-swatch" style="background: red;" data-color="#FF0000"></span>
      <span class="color-swatch" style="background: green;" data-color="#00FF00"></span>
      <span class="color-swatch" style="background: blue;" data-color="#0000FF"></span>
    </div>
  </div>

  <script>
    const marker = document.getElementById('hiro-marker');
    const overlay = document.getElementById('ui-overlay');
    const box = document.getElementById('ar-box');
    const slider = document.getElementById('size-slider');
    const sizeValue = document.getElementById('size-value');

    marker.addEventListener('markerFound', () => {
      overlay.style.display = 'block';
    });
    marker.addEventListener('markerLost', () => {
      overlay.style.display = 'none';
    });

    slider.addEventListener('input', () => {
      const val = slider.value;
      sizeValue.textContent = val;
      box.setAttribute('scale', `${val} ${val} ${val}`);
    });

    document.querySelectorAll('.color-swatch').forEach(swatch => {
      swatch.addEventListener('click', () => {
        box.setAttribute('color', swatch.dataset.color);
      });
    });
  </script>
</body>
</html>
